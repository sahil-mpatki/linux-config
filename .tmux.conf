# Use Ctrl-s as the tmux prefix.
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix
# Reload this configuration with prefix+r.
bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Split panes: prefix+- horizontally, prefix+| vertically.
bind-key - split-window -v
bind-key | split-window -h

# Navigate panes without the prefix.
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R
bind-key -n M-n next-window
bind-key -n M-p previous-window

# Enable mouse-based pane selection, resizing, scrolling, and window controls.
set-option -g mouse on

# Catppuccin Mocha theme.
set-option -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set-option -g status-left '#[fg=#cba6f7,bold] #S '
set-option -g status-right '#[fg=#a6adc8] %Y-%m-%d #[fg=#89b4fa] %H:%M '
set-window-option -g window-status-style 'bg=#181825,fg=#a6adc8'
set-window-option -g window-status-current-style 'bg=#cba6f7,fg=#1e1e2e,bold'
set-option -g pane-border-style 'fg=#313244'
set-option -g pane-active-border-style 'fg=#cba6f7'
set-option -g message-style 'bg=#313244,fg=#cdd6f4'
set-option -g message-command-style 'bg=#313244,fg=#cdd6f4'
set-option -g mode-style 'bg=#f9e2af,fg=#1e1e2e'
set-option -g clock-mode-colour '#cba6f7'

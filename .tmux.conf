# Use Ctrl-s as the tmux prefix.
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix
# Reload this configuration with prefix+r.
bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Split panes: prefix+- horizontally, prefix+| vertically.
bind-key - split-window -v
bind-key | split-window -h

# Navigate panes without the prefix.
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R
bind-key -n M-n next-window
bind-key -n M-p previous-window

# Enable mouse-based pane selection, resizing, scrolling, and window controls.
set-option -g mouse on

# Gruvbox Dark theme.
set-option -g status-style 'bg=#282828,fg=#ebdbb2'
set-option -g status-left '#[fg=#d79921,bold] #S '
set-option -g status-right '#[fg=#a89984] %Y-%m-%d #[fg=#83a598] %H:%M '
set-window-option -g window-status-style 'bg=#3c3836,fg=#a89984'
set-window-option -g window-status-current-style 'bg=#d79921,fg=#282828,bold'
set-option -g pane-border-style 'fg=#504945'
set-option -g pane-active-border-style 'fg=#d79921'
set-option -g message-style 'bg=#3c3836,fg=#ebdbb2'
set-option -g message-command-style 'bg=#3c3836,fg=#ebdbb2'
set-option -g mode-style 'bg=#fabd2f,fg=#282828'
set-option -g clock-mode-colour '#d79921'
